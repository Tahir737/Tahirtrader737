name: build-apk
on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check folder structure
        run: |
          pwd
          ls -la
          if [ -d "Tahirtrader737" ]; then ls -la Tahirtrader737; ls -la Tahirtrader737/src || echo "no src"; fi
          if [ -d "src" ]; then ls -la src; fi

      - name: Install dependencies
        run: |
          if [ -d "Tahirtrader737" ]; then cd Tahirtrader737; fi
          npm install

      - name: Build web app
        run: |
          if [ -d "Tahirtrader737" ]; then cd Tahirtrader737; fi
          npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          if [ -d "Tahirtrader737" ]; then cd Tahirtrader737; fi
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahirtrader-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            Tahirtrader737/android/app/build/outputs/apk/debug/app-debug.apk
