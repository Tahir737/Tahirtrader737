name: build-apk
on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd Tahirtrader737
          npm install

      - name: Build web app
        run: |
          cd Tahirtrader737
          npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd Tahirtrader737
          npm install -g @capacitor/cli
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tahirtrader-APK
          path: Tahirtrader737/android/app/build/outputs/apk/debug/app-debug.apk
